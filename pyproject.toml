[project]
name = "asana-integrator"
version = "0.1.0"
description = "GitHub Actions bot that posts commits and pull requests as formatted updates to an Asana task."
readme = "README.md"
authors = [
    { name = "tkacpertech", email = "tkacpertech@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
asana-integrator = "asana_integrator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
