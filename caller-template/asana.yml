name: Asana updates

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

# Kolejkuje uruchomienia, zeby push i pull_request nie walczyly o ten sam numer wpisu.
concurrency:
  group: asana-updates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  notify-asana:
    runs-on: ubuntu-latest
    steps:
      - uses: tkacpertech/git-asana-integrator@v1
        with:
          asana-token: ${{ secrets.ASANA_TOKEN }}
          asana-task-gid: ${{ vars.ASANA_TASK_GID }}
          # Opcjonalnie - branche, ktorych pushe maja byc pomijane:
          # ignore-branches: 'dependabot/*, tmp/*'
