name: Asana updates

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

jobs:
  notify-asana:
    runs-on: ubuntu-latest
    steps:
      - uses: tkacpertech/git-asana-integrator@v1
        with:
          asana-token: ${{ secrets.ASANA_TOKEN }}
          asana-task-gid: ${{ vars.ASANA_TASK_GID }}
